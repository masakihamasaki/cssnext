name: work-tools

on:
  pull_request:
    paths: [".claude/**", "work-tools/**", "docs/work-automation/**", ".github/workflows/work-tools.yml"]
  push:
    branches: [master]
    paths: [".claude/**", "work-tools/**", "docs/work-automation/**", ".github/workflows/work-tools.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install python-pptx python-docx
      - run: python -m unittest discover -s work-tools/content -v
      - name: Privacy check
        run: python work-tools/privacy_check.py --diff --base origin/${{ github.base_ref || 'master' }}
